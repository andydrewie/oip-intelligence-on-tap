<!doctype html><html lang="en"><meta charset="utf-8"><title>Local responsive review</title><style>body{margin:0;background:#e6e9f0;font:14px system-ui}header{padding:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:5px}iframe{display:block;background:white;border:1px solid #777;height:900px;margin:0 auto}</style><header><label>Width <select id="width"><option>320</option><option>360</option><option>390</option><option>430</option><option selected>440</option><option>640</option><option>700</option><option>701</option><option>950</option><option>951</option><option>1280</option><option>1440</option></select></label><label>Text size <select id="text"><option value="16" selected>100%</option><option value="32">200%</option></select></label><label>Section <select id="section"><option value="main">Opening</option><option value="proposition" selected>Proposition</option><option value="founding-story">Billing inspiration</option><option value="relationship">Relationship</option><option value="research">Research</option><option value="billing">Receipt</option></select></label><span>Responsive iframe + root text scaling; not physical-device Safari or actual browser zoom.</span></header><iframe title="Site under review" id="site" src="/#proposition" style="width:440px"></iframe><script>
const frame=document.querySelector('iframe'); const w=document.querySelector('#width'),t=document.querySelector('#text'),s=document.querySelector('#section');
function size(){frame.style.width=w.value+'px';if(t.value!=='16')frame.contentDocument.documentElement.style.fontSize=t.value+'px';else frame.contentDocument.documentElement.style.removeProperty('font-size')}
w.onchange=size;t.onchange=size;s.onchange=()=>{frame.src='/#'+s.value};frame.onload=size;
</script></html>
